  <path d="M36 32 L37.3 35.7 41 37 37.3 38.3 36 42 34.7 38.3 31 37 34.7 35.7Z" stroke="none"/>
  <path d="M92 32 L93.3 35.7 97 37 93.3 38.3 92 42 90.7 38.3 87 37 90.7 35.7Z" stroke="none"/>
 </g>
 <!-- Two satellite shards, following the approved central-crystal motif. -->
 <g stroke="#216F98" stroke-width="1.4" stroke-linejoin="round">
  <path d="M30 68 L38 62 44 73 39 86 30 79Z" fill="#5BC6E8"/>
  <path d="M30 68 L38 62 39 86 35 77Z" fill="#C5F9FA"/>
  <path d="M98 68 L90 62 84 73 89 86 98 79Z" fill="#5BC6E8"/>
  <path d="M98 68 L90 62 89 86 93 77Z" fill="#C5F9FA"/>
 </g>
 <!-- Central faceted blue crystal. -->
 <g stroke="#1C6B94" stroke-width="1.8" stroke-linejoin="round">
  <path d="M64 27 L86 66 64 103 42 66Z" fill="url(#blue)"/>
  <path d="M64 27 L64 103 42 66Z" fill="#79D9F2" stroke="none"/>
  <path d="M64 27 L72 66 64 103 53 66Z" fill="#D8FFFF" stroke="none"/>
