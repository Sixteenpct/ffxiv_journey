 <g fill="#E6BB65" stroke="#A47732" stroke-width=".8" stroke-linejoin="round">
  <path d="M64 10 L66.5 16.5 73 19 66.5 21.5 64 28 61.5 21.5 55 19 61.5 16.5Z"/>
