 </g>
 <!-- Open book in front of the crystal, wide clear pages, no blurry raster. -->
 <g stroke-linejoin="round" stroke-linecap="round">
  <path d="M64 110 C50 105 36 101 18 104 L22 112 C38 110 50 113 64 120 C78 113 90 110 106 112 L110 104 C92 101 78 105 64 110Z" fill="#C49B52" stroke="#755929" stroke-width="2"/>
