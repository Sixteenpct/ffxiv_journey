<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="FF14 Journey 水晶之書">
 <defs>
  <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#FFFEF7"/>
   <stop offset="1" stop-color="#FFF1D7"/>
  </linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
   <stop offset="0" stop-color="#80E6F8"/>
   <stop offset=".54" stop-color="#48B9E5"/>
   <stop offset="1" stop-color="#176C9E"/>
  </linearGradient>
 </defs>
 <!-- The rounded board and its frame are clean vector shapes, not a screenshot crop. -->
 <rect x="4" y="4" width="120" height="120" rx="20" fill="url(#paper)" stroke="#D1AF75" stroke-width="1.9"/>
 <rect x="7.5" y="7.5" width="113" height="113" rx="17" fill="none" stroke="#E9D0A3" stroke-width="1"/>
